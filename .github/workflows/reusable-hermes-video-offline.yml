name: Reusable Hermes Video Offline

on:
  workflow_call:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:hermes-video-contract
      - run: npm run check:hermes-video-offline
